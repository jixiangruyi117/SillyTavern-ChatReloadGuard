<div class="chat-reload-guard inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>聊天重载保护器</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="chat-reload-guard__summary">
            <span>运行状态</span>
            <strong id="chat-reload-guard-status" data-status="checking">检查中</strong>
        </div>
        <p id="chat-reload-guard-detail" class="chat-reload-guard__detail">
            正在核对 SillyTavern 版本和聊天重载接口。
        </p>
        <p class="chat-reload-guard__note">
            插件只在一次聊天重载期间保护当前会话；聊天快照仅保存在内存中，不会写入设置、日志或服务器。
        </p>
        <label class="chat-reload-guard__setting" for="chat-reload-guard-mobile-fix">
            <input id="chat-reload-guard-mobile-fix" type="checkbox">
            <span>
                <b>修复移动端软键盘高度残留</b>
                <small>记录键盘弹出前的稳定页面高度；收起输入法时立即恢复聊天区域，避免输入栏下方留下黑色空白。默认关闭，可随时恢复酒馆原行为。</small>
            </span>
        </label>
        <p id="chat-reload-guard-mobile-fix-status" class="chat-reload-guard__detail">未启用。</p>
        <label class="chat-reload-guard__setting" for="chat-reload-guard-mobile-diagnostics">
            <input id="chat-reload-guard-mobile-diagnostics" type="checkbox">
            <span>
                <b>记录移动端键盘诊断（只读）</b>
                <small>仅在内存记录视口尺寸、聊天区域坐标、焦点与长任务耗时；不读取聊天正文、输入内容、账号或请求数据。</small>
            </span>
        </label>
        <p id="chat-reload-guard-mobile-diagnostics-status" class="chat-reload-guard__detail">未记录。</p>
        <div class="chat-reload-guard__diagnostics-actions">
            <button id="chat-reload-guard-copy-diagnostics" type="button" class="menu_button">复制诊断报告</button>
            <button id="chat-reload-guard-clear-diagnostics" type="button" class="menu_button">清空诊断</button>
        </div>
    </div>
</div>
