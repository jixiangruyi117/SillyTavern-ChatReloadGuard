<div class="chat-reload-guard inline-drawer">
    <div class="inline-drawer-toggle inline-drawer-header">
        <b>聊天重载保护器</b>
        <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
    </div>
    <div class="inline-drawer-content">
        <div class="chat-reload-guard__summary">
            <span>运行状态</span>
            <strong id="chat-reload-guard-status" data-status="checking">检查中</strong>
        </div>
        <p id="chat-reload-guard-detail" class="chat-reload-guard__detail">
            正在核对 SillyTavern 版本和聊天重载接口。
        </p>
        <p class="chat-reload-guard__note">
            插件只在一次聊天重载期间保护当前会话；聊天快照仅保存在内存中，不会写入设置、日志或服务器。
        </p>
        <label class="chat-reload-guard__source-trace" for="chat-reload-guard-source-trace">
            <input id="chat-reload-guard-source-trace" type="checkbox">
            <span>
                <b>记录酒馆源码键盘时序（只读）</b>
                <small>仅记录输入框焦点、长任务、resize 与酒馆根节点定位写入/恢复；不改布局，不读取聊天或输入内容。</small>
            </span>
        </label>
        <p id="chat-reload-guard-source-trace-status" class="chat-reload-guard__detail">未启用。</p>
        <div class="chat-reload-guard__source-trace-actions">
            <button id="chat-reload-guard-copy-source-trace" type="button" class="menu_button">复制源码时序</button>
            <button id="chat-reload-guard-clear-source-trace" type="button" class="menu_button">清空源码时序</button>
        </div>
    </div>
</div>
